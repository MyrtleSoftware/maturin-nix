[package]
name = "maturin-nix"
version = "0.1.0"
authors = ["Christopher Chalmers <c.chalmers@me.com>"]
edition = "2018"

exclude = [
  "examples/*",
]

[dependencies]
maturin = "0.7.6"
structopt = "0.3"
ansi_term = "0.12"
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"
walkdir = "2.2"
